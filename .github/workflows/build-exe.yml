name: 构建 Windows exe

on:
  push:
    branches: [main]
    paths: [main.py, requirements.txt, .github/workflows/build-exe.yml]
    tags: [v*]
  workflow_dispatch:

permissions:
  contents: write  # 打 tag 时发布 Release

env:
  NUITKA_CACHE_DIR: ${{ github.workspace }}\nuitka_cache

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: 缓存 Nuitka 编译结果
        uses: actions/cache@v6
        with:
          path: ${{ env.NUITKA_CACHE_DIR }}
          key: ${{ runner.os }}-nuitka-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-

      - name: 安装依赖
        run: pip install -r requirements.txt nuitka==4.2.2

      - name: Nuitka 打包单文件 exe
        run: |
          python -m nuitka --standalone --onefile --assume-yes-for-downloads `
            --include-package-data=pypinyin --include-windows-runtime-dlls=no `
            --output-dir=build --output-filename=tarkov-tool.exe `
            --remove-output --windows-console-mode=force main.py

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: tarkov-tool-exe
          path: build/tarkov-tool.exe
          retention-days: 30

      - name: 打 tag 时发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: build/tarkov-tool.exe
          generate_release_notes: true
